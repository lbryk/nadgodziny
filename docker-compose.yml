# docker compose up -d --build
# Create .env next to this file (see .env.example) — at least ADMIN_PASSWORD.
services:
  nadgodziny:
    build: .
    image: nadgodziny:latest
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-8}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - nadgodziny-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  nadgodziny-data:
